name: stir
options:
  bundleIdPrefix: com.pureinference
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

schemes:
  stir:
    build:
      targets:
        stir: all
        stir-widgets: all
    run:
      executable: stir
    profile:
      executable: stir
    archive:
      executable: stir

settings:
  base:
    DEVELOPMENT_TEAM: 86CCQ2AT2P
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  stir:
    type: application
    platform: iOS
    sources:
      - path: stir
        excludes:
          - "**/*.md"
    resources:
      - path: stir/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pureinference.stir
        INFOPLIST_FILE: stir/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: stir/Info.plist
      properties:
        CFBundleDisplayName: stir
        CFBundleName: stir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "stir needs microphone access to detect when you start moving around during your wake window. the mic session stays ready overnight while white noise plays, but nothing is evaluated or recorded before your wake window begins."
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: "stir uses your approximate location only to draw the real sun and moon in the night sky. It never leaves your device."
        NSAlarmKitUsageDescription: "stir schedules a backup system alarm at your 'up by' time so you never oversleep, even if the app is closed overnight."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.pureinference.stir
            CFBundleURLSchemes:
              - stir
    entitlements:
      path: stir/stir.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: stir-widgets

  stir-widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: stir-widgets
      - path: stir/Models/StirActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pureinference.stir.widgets
        INFOPLIST_FILE: stir-widgets/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: stir-widgets/Info.plist
      properties:
        CFBundleDisplayName: stir-widgets
        CFBundleName: stir-widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
